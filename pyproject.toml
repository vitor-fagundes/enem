[project]
name = "enem-rei-analytics"
version = "0.0.0"
description = "Fundação do analytics local do enem-rei"
requires-python = ">=3.12,<3.13"
dependencies = ["polars", "duckdb"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["packages/analytics/src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
